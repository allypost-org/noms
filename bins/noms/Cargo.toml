[package]
name = "noms"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
app-server = { path = "../../crates/app-server", version = "*", optional = true }
app-services.workspace = true
clap.workspace = true
clap_complete = "4.6.11"
directories = "6.0.0"
dotenvy = "0.15.7"
owo-colors = { version = "4.4.0", features = ["alloc", "supports-colors"] }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = {
  version = "0.3.23",
  features = [
    "env-filter",
    "parking_lot",
    "smallvec",
  ]
}
validator = "0.21.0"

[features]
default = []
server = ["app-server"]

[lints]
workspace = true
