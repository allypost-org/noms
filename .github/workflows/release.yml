name: Release core

# See RELEASING.md for the initial publish and Trusted Publishing setup.
on:
  push:
    tags: ["noms-core-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify tag matches the core package
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(scripts/check-core-release-tag "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  publish-crate:
    needs: checks
    if: vars.PUBLISH_CRATE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.11.5
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
        id: auth
      - run: mise exec -- cargo publish -p noms-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: [version, checks, publish-crate]
    if: >-
      always() && needs.checks.result == 'success' &&
      (needs.publish-crate.result == 'success' || needs.publish-crate.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: noms-core-package
          path: dist
      - name: Create the GitHub release with the verified source package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          CORE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          flags=()
          if [[ "$CORE_VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.crate \
            --repo "$GITHUB_REPOSITORY" \
            --title "noms-core $CORE_VERSION" \
            --generate-notes --verify-tag "${flags[@]}"
