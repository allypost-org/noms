[package]
name = "app-services"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
either = { version = "1.19.0", features = ["serde"] }
futures-util = "0.3"
jiff.workspace = true
lettre = { version = "0.11.23", default-features = false, features = ["builder", "hostname", "pool", "ring", "rustls", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots"], optional = true }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["hickory-dns", "json", "rustls"], optional = true }
serde.workspace = true
serde_json.workspace = true
serde_qs = "1.1.3"
thiserror = "2.0.21"
tracing.workspace = true
url.workspace = true
urlencoding = { version = "2.1.3", optional = true }

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tempfile = "3"
tokio.workspace = true

[features]
default = ["email", "telegram"]
email = ["dep:lettre", "dep:urlencoding"]
telegram = ["dep:reqwest"]

[lints]
workspace = true
