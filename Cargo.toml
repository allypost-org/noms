[workspace]
resolver = "2"
members = ["bins/*", "crates/*"]

[workspace.package]
version = "0.1.1"
edition = "2024"
description = "NOtification Management System - a way to send notifications to various services in a unified way"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
jiff = { version = "0.2", features = ["serde"] }
noms-core = { path = "./crates/noms-core", version = "0.1.1" }
serde = { version = "1.0.229", features = ["alloc", "derive"] }
serde_json = { version = "1.0.154", features = ["alloc"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "parking_lot", "rt-multi-thread"] }
tracing = { version = "0.1.44" }
url = { version = "2.5.8", features = ["serde"] }

[workspace.lints.clippy]
cognitive_complexity = "allow"
expect_used = "warn"
manual_let_else = "allow"
missing_const_for_fn = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
no_effect_underscore_binding = "allow"
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
single_match_else = "allow"
uninlined_format_args = "allow"
unwrap_used = "warn"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

[profile.release-cli]
inherits = "release"
opt-level = "s"
lto = true
panic = "abort"
